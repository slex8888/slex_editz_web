<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS GENERATOR</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  padding: 20px 14px;
  background: #08060d;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 520px;
  margin: 20px auto;
  padding: 28px 20px;
  border: 1px solid #302039;
  border-radius: 28px;
  background: #100d16;
  box-shadow: 0 0 30px #a13bff15;
}

header {
  text-align: center;
  margin-bottom: 30px;
}

.logo {
  width: 90px;
  height: 90px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  border: 3px solid #c14aff;
  border-radius: 50%;
  background: #21102c;
  box-shadow: 0 0 24px #c14aff40;
  font-size: 38px;
}

h1 {
  font-size: 25px;
  font-weight: 900;
}

.subtitle {
  margin-top: 12px;
  color: #c65bfa;
  letter-spacing: 2px;
}

.card {
  margin: 20px 0;
  padding: 20px;
  border: 1px solid #30253a;
  border-radius: 18px;
  background: #15111c;
}

h2 {
  margin-bottom: 18px;
  font-size: 18px;
}

.provider {
  width: 100%;
  min-height: 58px;
  margin: 9px 0;
  padding: 14px;
  border: 1px solid #3a3045;
  border-radius: 12px;
  background: #201927;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.provider:hover {
  border-color: #c14aff;
  background: #30203b;
}

.google {
  color: #fff;
}

.facebook {
  background: #173e83;
  border-color: #2860bb;
}

.facebook:hover {
  background: #2054a6;
}

input {
  width: 100%;
  padding: 17px;
  margin-top: 12px;
  border: 1px solid #39303f;
  border-radius: 12px;
  outline: none;
  background: #08070c;
  color: white;
  font-size: 15px;
}

input:focus {
  border-color: #c14aff;
}

.generate {
  width: 100%;
  padding: 19px 10px;
  margin-top: 18px;
  border: 0;
  border-radius: 13px;
  background: linear-gradient(100deg, #8c43ee, #d642e8);
  color: white;
  font-weight: 900;
  font-size: 16px;
  cursor: pointer;
}

.message {
  display: none;
  margin-top: 16px;
  padding: 14px;
  border-radius: 10px;
  background: #21152b;
  color: #e0b4ff;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.note {
  margin-top: 14px;
  color: #9991a5;
  font-size: 12px;
  line-height: 1.6;
}

footer {
  margin-top: 28px;
  text-align: center;
  color: #777080;
  font-size: 12px;
}
</style>
</head>

<body>

<main class="container">

<header>
  <div class="logo">⚡</div>
  <h1>ACCESS GENERATOR</h1>
  <p class="subtitle">SECURE AUTHENTICATION</p>
</header>

<section class="card">
  <h2>SELECT LOGIN METHOD</h2>

  <button class="provider google" id="googleBtn">
    🌐 Continue with Google
  </button>

  <button class="provider facebook" id="facebookBtn">
    f &nbsp; Continue with Facebook
  </button>

  <p class="note">
    Login buttons open the official provider websites.
    Real account authentication requires application setup.
  </p>
</section>

<section class="card">
  <h2>URL VALIDATOR</h2>

  <input
    id="urlInput"
    type="url"
    placeholder="Paste a URL to validate"
    autocomplete="off"
  >

  <button class="generate" id="validateBtn">
    VALIDATE URL →
  </button>

  <div class="message" id="message" role="status"></div>
</section>

<footer>
  Secure Authentication Demo · 2026
</footer>

</main>

<script>
const message = document.getElementById("message");

document.getElementById("googleBtn").addEventListener("click", () => {
  window.location.href =
    "https://accounts.google.com/";
});

document.getElementById("facebookBtn").addEventListener("click", () => {
  window.location.href =
    "https://www.facebook.com/login/";
});

document.getElementById("validateBtn").addEventListener("click", () => {
  const value = document.getElementById("urlInput").value.trim();

  message.style.display = "block";

  if (!value) {
    message.textContent = "Please enter a URL first.";
    return;
  }

  try {
    const url = new URL(value);

    if (url.protocol !== "https:" && url.protocol !== "http:") {
      message.textContent = "Unsupported URL protocol.";
      return;
    }

    message.textContent =
      "URL format is valid. This demo does not generate access tokens.";
  } catch {
    message.textContent = "Invalid URL. Please check your input.";
  }
});
</script>

</body>
</html>
