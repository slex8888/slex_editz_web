<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLEX.EDITZ - Access Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d0d0d;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 420px;
    background: #161616;
    border-radius: 14px;
    padding: 28px 22px;
    box-shadow: 0 0 25px rgba(0,255,150,0.15);
    border: 1px solid #1f1f1f;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    color: #00ff9d;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    font-size: 12px;
    color: #888;
    letter-spacing: 3px;
    margin-bottom: 22px;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
  }
  .login { background: #fff; color: #000; }
  .login:hover { background: #ddd; }
  .facebook { background: #1877f2; color: #fff; }
  .facebook:hover { background: #0f5fce; }
  label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin: 14px 0 6px;
    letter-spacing: 1px;
  }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2a2a2a;
    background: #0d0d0d;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  input:focus { border-color: #00ff9d; }
  .convert {
    background: linear-gradient(90deg, #00ff9d, #00b36b);
    color: #000;
    margin-top: 14px;
  }
  .convert:hover { filter: brightness(1.15); }
  .result {
    margin-top: 18px;
    background: #0d0d0d;
    border: 1px solid #00ff9d33;
    border-radius: 10px;
    padding: 14px;
    display: none;
  }
  .result-title {
    font-size: 12px;
    color: #00ff9d;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  #resultText {
    font-size: 13px;
    line-height: 1.7;
    word-break: break-all;
    color: #ddd;
  }
  #resultText span { color: #00ff9d; font-weight: 600; }
  .copy {
    background: #222;
    color: #00ff9d;
    margin-top: 12px;
    border: 1px solid #00ff9d55;
  }
  .copy:hover { background: #2a2a2a; }
  #status {
    text-align: center;
    font-size: 13px;
    margin-top: 14px;
    min-height: 18px;
    color: #ffb300;
  }
  #status.error { color: #ff4d4d; }
  #status.success { color: #00ff9d; }
  .footer {
    text-align: center;
    font-size: 11px;
    color: #555;
    margin-top: 22px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="container">
  <h1>ACCESS GENERATOR</h1>
  <p class="subtitle">SECURE ACCESS INTERFACE</p>

  <button class="login" onclick="openProvider('google')">Continue with Google</button>
  <button class="facebook" onclick="openProvider('facebook')">Continue with Facebook</button>

  <label for="accessLink">Paste Your Link</label>
  <input id="accessLink" type="url" placeholder="https://example.com/?eat=..." autocomplete="off">

  <button class="convert" id="convertBtn" onclick="processLink()">ACCESS TOKEN</button>

  <section class="result" id="result">
    <div class="result-title">LINK INFORMATION</div>
    <div id="resultText"></div>
    <button class="copy" onclick="copyResult()">COPY RESULT</button>
  </section>

  <div id="status" role="status"></div>

  <div class="footer">
    LINK VALIDATION MODE<br>
    REAL TOKEN CONVERSION REQUIRES AN AUTHORIZED API
  </div>
</div>

<script>
function openProvider(provider) {
  setStatus("Redirecting to " + provider + "...", "");
}

function setStatus(msg, type) {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = type || "";
}

function extractEatToken(input) {
  input = input.trim();
  if (!input) return null;

  // अगर पूरा URL है
  try {
    if (input.includes("http") || input.includes("?")) {
      const url = new URL(input);
      const eat = url.searchParams.get("eat");
      if (eat) return eat;
    }
  } catch (e) { /* ignore */ }

  // अगर सीधा token है
  if (/^[A-Za-z0-9._\-]+$/.test(input)) return input;

  return null;
}

async function processLink() {
  const rawInput = document.getElementById("accessLink").value;
  const eatToken = extractEatToken(rawInput);

  if (!eatToken) {
    setStatus("❌ कोई valid EAT token नहीं मिला। सही लिंक या टोकन डालें।", "error");
    return;
  }

  setStatus("⏳ Processing... Connecting to server...", "");

  const apiUrl = `https://api-otrss.garena.com/support/callback/?access_token=${encodeURIComponent(eatToken)}`;

  try {
    // CORS proxy के जरिए request (क्योंकि browser सीधे Garena API को call नहीं कर सकता)
    const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(apiUrl);

    const response = await fetch(proxyUrl, {
      method: "GET",
      headers: {
        "User-Agent": "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Mobile Safari/537.36"
      },
      redirect: "follow"
    });

    const finalUrl = response.url;

    // Final URL से parameters निकालें
    let finalParams;
    try {
      const parsed = new URL(finalUrl);
      finalParams = parsed.searchParams;
    } catch (e) {
      // अगर finalUrl valid URL नहीं है तो response text में ढूंढें
      const text = await response.text();
      const match = text.match(/access_token=([^&"'\s]+)/);
      if (match) {
        showResult({
          access_token: decodeURIComponent(match[1]),
          account_id: "Unknown",
          nickname: "Unknown",
          region: "Unknown"
        });
        return;
      }
      throw new Error("Access token not found in response.");
    }

    const accessToken = finalParams.get("access_token");
    if (!accessToken) {
      throw new Error("Access Token not found. EAT token expired or invalid हो सकता है।");
    }

    const accountId = finalParams.get("account_id") || "Unknown";
    const nickname = decodeURIComponent(finalParams.get("nickname") || "Unknown");
    const region = finalParams.get("region") || "Unknown";

    showResult({
      access_token: accessToken,
      account_id: accountId,
      nickname: nickname,
      region: region
    });

  } catch (err) {
    console.error(err);
    setStatus("❌ Error: " + err.message, "error");
  }
}

function showResult(data) {
  const resultBox = document.getElementById("result");
  const resultText = document.getElementById("resultText");

  resultText.innerHTML = `
    <div><span>Nickname:</span> ${data.nickname}</div>
    <div><span>Account ID:</span> ${data.account_id}</div>
    <div><span>Region:</span> ${data.region}</div>
    <div style="margin-top:8px;"><span>Access Token:</span><br>${data.access_token}</div>
  `;

  resultBox.style.display = "block";
  resultBox.dataset.copy = `Nickname: ${data.nickname}\nAccount ID: ${data.account_id}\nRegion: ${data.region}\nAccess Token: ${data.access_token}`;

  setStatus("✅ Success! Token generated.", "success");
}

function copyResult() {
  const resultBox = document.getElementById("result");
  const text = resultBox.dataset.copy || "";
  if (!text) return;

  navigator.clipboard.writeText(text).then(() => {
    setStatus("📋 Result copied to clipboard!", "success");
  }).catch(() => {
    setStatus("❌ Copy failed.", "error");
  });
}
</script>

</body>
</html>
