<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080610">
<title>SLEX.EDITZ | Access Tool</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 22px 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080610;
    color: #f5efff;
    font-family: Arial, sans-serif;
}

.card {
    width: 100%;
    max-width: 430px;
    padding: 27px 22px;
    background: #100b1b;
    border: 1px solid #512080;
    border-radius: 23px;
    box-shadow: 0 0 28px #8b27e51c;
}

h1 {
    text-align: center;
    color: #c084fc;
    font-size: 27px;
    letter-spacing: 3px;
    overflow-wrap: anywhere;
}

.subtitle {
    text-align: center;
    color: #9689a9;
    font-size: 12px;
    letter-spacing: 2px;
    margin: 12px 0 28px;
}

button {
    width: 100%;
    padding: 15px 10px;
    border: none;
    border-radius: 12px;
    margin-bottom: 13px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.google {
    color: #25143d;
    background: #eee7ff;
}

.facebook {
    color: white;
    background: #6425c5;
}

label {
    display: block;
    margin: 17px 0 10px;
    color: #c9a6f5;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 15px 13px;
    border: 1px solid #332342;
    border-radius: 12px;
    outline: none;
    color: white;
    background: #090711;
    font-size: 13px;
}

input:focus {
    border-color: #a855f7;
}

.generate {
    margin-top: 17px;
    margin-bottom: 0;
    color: white;
    background: linear-gradient(90deg, #7724c8, #bd35ff);
    letter-spacing: 1px;
}

.result {
    display: none;
    margin-top: 17px;
    padding: 14px;
    border: 1px solid #332342;
    border-radius: 12px;
    background: #090711;
    overflow-wrap: anywhere;
}

.result-title {
    margin-bottom: 10px;
    color: #c084fc;
    font-size: 13px;
    font-weight: bold;
}

#resultText {
    color: #eee3ff;
    font-size: 12px;
    line-height: 1.7;
    word-break: break-all;
}

.copy {
    margin-top: 13px;
    margin-bottom: 0;
    background: #38165b;
    color: white;
}

.status {
    margin-top: 15px;
    color: #c084fc;
    text-align: center;
    font-size: 12px;
    line-height: 1.6;
}

.footer {
    margin-top: 25px;
    color: #72657f;
    font-size: 10px;
    text-align: center;
    letter-spacing: 1px;
    line-height: 1.8;
}
</style>
</head>

<body>

<main class="card">
    <h1>ACCESS TOOL</h1>
    <p class="subtitle">LINK VALUE EXTRACTOR</p>

    <button class="google" onclick="openProvider('google')">
        Continue with Google
    </button>

    <button class="facebook" onclick="openProvider('facebook')">
        Continue with Facebook
    </button>

    <label for="accessLink">Access Link</label>

    <input
        id="accessLink"
        type="url"
        placeholder="Paste your complete link here"
        autocomplete="off"
    >

    <button class="generate" onclick="extractValue()">
        EXTRACT EAT VALUE
    </button>

    <section class="result" id="result">
        <div class="result-title">EXTRACTED VALUE</div>
        <div id="resultText"></div>

        <button class="copy" onclick="copyValue()">
            COPY VALUE
        </button>
    </section>

    <div class="status" id="status" role="status"></div>

    <div class="footer">
        LINK EXTRACTION ONLY<br>
        NO REAL ACCOUNT TOKEN GENERATION
    </div>
</main>

<script>
"use strict";

let extractedValue = "";

function openProvider(provider) {
    const pages = {
        google: "https://accounts.google.com/v3/signin/accountchooser?client_id=185753624591-3sg2arfuus5i1anc2jcfarepnf6cdlaq.apps.googleusercontent.com&prompt=select_account&redirect_uri=https%3A%2F%2Fauth.garena.com%2Funiversal%2Foauth%2Fgoogle&response_type=code&scope=profile+email+openid&state=87119ed8f91a44bab4fd85ac939b9fbf-platform%3D8%26response_type%3Dcode%26locale%3Den-SG%26client_id%3D100067%26redirect_uri%3Dhttps%253A%252F%252Fapi.ff.garena.co.id%252Fauth%252Fauth%252Fcallback_n%253Fsite%253Dhttps%253A%252F%252Fapi-discountstore.kiosgamer.gameid.garena.co.id%252Foauth%252Fcallback_redirect%252F&dsh=S-1222640184%3A1792064686751866&o2v=2&service=lso&flowName=GeneralOAuthFlow&opparams=%253F&continue=https%3A%2F%2Faccounts.google.com%2Fsignin%2Foauth%2Fv3%2Fconsent%3Fauthuser%3Dunknown%26part%3DAJi8hANKsPUftUlnRSgCDt2KK7HW2HI7RLDfYzcyi4haQ5vIkz0qLmjFN9CRdXtKdm2sxwvoqaEiWg01uFaJtXbVH_qt3GC1DP7mRCv3PPZtdgWT_FP-Rb88ketvQwxkWJW7E3U5MVI2k9ORWchSuuOz2bUgoNPK2HHf256I5L5OdRztu0UHna-eRD3htKjEvwFdJ8WIL5T_BvqMafLLYg0OIDWcx5U_9FiL6tvfFyDKNGXdoyYZpNzqX_TMQ05igD2faXKuF8BzDHfjeXoxAfv42HpCBmNTS14CkGv4bV3wQUgw-v6LyMLGbRhUSP5B7yX47XiioiETWpaKL_jEyqC6_17qYEOGfz_IY74-5fpndXYUwFUbmuTHwTd_Dtswy4wJ_SJcoK1SjTkd5W6W8YMowD_cXFhVKJeCAG3eoyiXN7JZCh4wLR4KjqpovHPVFd3P8pLtngtoHcjlnXUmIBildxot71VSlQ%26flowName%3DGeneralOAuthFlow%26as%3DS-1222640184%253A1792064686751866%26client_id%3D185753624591-3sg2arfuus5i1anc2jcfarepnf6cdlaq.apps.googleusercontent.com%26requestPath%3D%252Fsignin%252Foauth%252Fv3%252Fconsent%23&app_domain=https%3A%2F%2Fauth.garena.com",
        facebook: "https://www.facebook.com/login/"
    };

    if (!Object.prototype.hasOwnProperty.call(pages, provider)) {
        return;
    }

    window.open(pages[provider], "_blank", "noopener,noreferrer");

    document.getElementById("status").textContent =
        "Login page opened. This tool does not collect login details.";
}

function extractValue() {
    const input = document.getElementById("accessLink").value.trim();
    const result = document.getElementById("result");
    const resultText = document.getElementById("resultText");
    const status = document.getElementById("status");

    extractedValue = "";
    result.style.display = "none";

    if (!input) {
        status.textContent = "Please paste a complete URL.";
        return;
    }

    try {
        const url = new URL(input);

        if (url.protocol !== "https:") {
            status.textContent = "Please use a valid HTTPS link.";
            return;
        }

        const value = url.searchParams.get("eat");

        if (!value) {
            status.textContent = "The URL does not contain an eat= parameter.";
            return;
        }

        extractedValue = value;
        resultText.textContent = value;
        result.style.display = "block";

        status.textContent =
            "Value extracted successfully. It has not been verified as an access token.";

    } catch (error) {
        status.textContent =
            "Invalid URL. Paste the complete link, including https://";
    }
}

async function copyValue() {
    const status = document.getElementById("status");

    if (!extractedValue) {
        status.textContent = "Extract a value first.";
        return;
    }

    try {
        await navigator.clipboard.writeText(extractedValue);
        status.textContent = "Value copied to clipboard.";
    } catch (error) {
        status.textContent =
            "Clipboard access unavailable. Select the displayed value and copy it manually.";
    }
}
</script>

</body>
</html>
