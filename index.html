<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080610">
<title>SLEX.EDITZ | Access Tool</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 22px 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080610;
    color: #f5efff;
    font-family: Arial, sans-serif;
}

.card {
    width: 100%;
    max-width: 430px;
    padding: 27px 22px;
    background: #100b1b;
    border: 1px solid #512080;
    border-radius: 23px;
    box-shadow: 0 0 28px #8b27e51c;
}

h1 {
    text-align: center;
    color: #c084fc;
    font-size: 27px;
    letter-spacing: 3px;
    overflow-wrap: anywhere;
}

.subtitle {
    text-align: center;
    color: #9689a9;
    font-size: 12px;
    letter-spacing: 2px;
    margin: 12px 0 28px;
}

button {
    width: 100%;
    padding: 15px 10px;
    border: none;
    border-radius: 12px;
    margin-bottom: 13px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.google {
    color: #25143d;
    background: #eee7ff;
}

.facebook {
    color: white;
    background: #6425c5;
}

label {
    display: block;
    margin: 17px 0 10px;
    color: #c9a6f5;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 15px 13px;
    border: 1px solid #332342;
    border-radius: 12px;
    outline: none;
    color: white;
    background: #090711;
    font-size: 13px;
}

input:focus {
    border-color: #a855f7;
}

.generate {
    margin-top: 17px;
    margin-bottom: 0;
    color: white;
    background: linear-gradient(90deg, #7724c8, #bd35ff);
    letter-spacing: 1px;
}

.result {
    display: none;
    margin-top: 17px;
    padding: 14px;
    border: 1px solid #332342;
    border-radius: 12px;
    background: #090711;
    overflow-wrap: anywhere;
}

.result-title {
    margin-bottom: 10px;
    color: #c084fc;
    font-size: 13px;
    font-weight: bold;
}

#resultText {
    color: #eee3ff;
    font-size: 12px;
    line-height: 1.7;
    word-break: break-all;
}

.copy {
    margin-top: 13px;
    margin-bottom: 0;
    background: #38165b;
    color: white;
}

.status {
    margin-top: 15px;
    color: #c084fc;
    text-align: center;
    font-size: 12px;
    line-height: 1.6;
}

.footer {
    margin-top: 25px;
    color: #72657f;
    font-size: 10px;
    text-align: center;
    letter-spacing: 1px;
    line-height: 1.8;
}
</style>
</head>

<body>

<main class="card">
    <h1>ACCESS TOOL</h1>
    <p class="subtitle">LINK VALUE EXTRACTOR</p>

    <button class="google" onclick="openProvider('google')">
        Continue with Google
    </button>

    <button class="facebook" onclick="openProvider('facebook')">
        Continue with Facebook
    </button>

    <label for="accessLink">Access Link</label>

    <input
        id="accessLink"
        type="url"
        placeholder="Paste your complete link here"
        autocomplete="off"
    >

    <button class="generate" onclick="extractValue()">
        EXTRACT EAT VALUE
    </button>

    <section class="result" id="result">
        <div class="result-title">EXTRACTED VALUE</div>
        <div id="resultText"></div>

        <button class="copy" onclick="copyValue()">
            COPY VALUE
        </button>
    </section>

    <div class="status" id="status" role="status"></div>

    <div class="footer">
        LINK EXTRACTION ONLY<br>
        NO REAL ACCOUNT TOKEN GENERATION
    </div>
</main>

<script>
"use strict";

let extractedValue = "";

function openProvider(provider) {
    const pages = {
        google: "https://accounts.google.com/",
        facebook: "https://www.facebook.com/login/"
    };

    if (!Object.prototype.hasOwnProperty.call(pages, provider)) {
        return;
    }

    window.open(pages[provider], "_blank", "noopener,noreferrer");

    document.getElementById("status").textContent =
        "Login page opened. This tool does not collect login details.";
}

function extractValue() {
    const input = document.getElementById("accessLink").value.trim();
    const result = document.getElementById("result");
    const resultText = document.getElementById("resultText");
    const status = document.getElementById("status");

    extractedValue = "";
    result.style.display = "none";

    if (!input) {
        status.textContent = "Please paste a complete URL.";
        return;
    }

    try {
        const url = new URL(input);

        if (url.protocol !== "https:") {
            status.textContent = "Please use a valid HTTPS link.";
            return;
        }

        const value = url.searchParams.get("eat");

        if (!value) {
            status.textContent = "The URL does not contain an eat= parameter.";
            return;
        }

        extractedValue = value;
        resultText.textContent = value;
        result.style.display = "block";

        status.textContent =
            "Value extracted successfully. It has not been verified as an access token.";

    } catch (error) {
        status.textContent =
            "Invalid URL. Paste the complete link, including https://";
    }
}

async function copyValue() {
    const status = document.getElementById("status");

    if (!extractedValue) {
        status.textContent = "Extract a value first.";
        return;
    }

    try {
        await navigator.clipboard.writeText(extractedValue);
        status.textContent = "Value copied to clipboard.";
    } catch (error) {
        status.textContent =
            "Clipboard access unavailable. Select the displayed value and copy it manually.";
    }
}
</script>

</body>
</html>
