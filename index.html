<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090610">
<title>SLEX.EDITZ - Access Tool</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #090610;
    color: #fff;
    font-family: Arial, sans-serif;
}

.card {
    width: 100%;
    max-width: 430px;
    padding: 25px 21px;
    border: 1px solid #57238a;
    border-radius: 22px;
    background: #110b1d;
    box-shadow: 0 0 35px #7627c522;
}

h1 {
    color: #c084fc;
    font-size: 26px;
    text-align: center;
    letter-spacing: 2px;
}

.subtitle {
    color: #91839f;
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    margin: 12px 0 28px;
}

label {
    display: block;
    margin: 20px 0 10px;
    color: #c9a6f5;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 15px 12px;
    border-radius: 11px;
    border: 1px solid #39264d;
    background: #090711;
    color: white;
    font-size: 13px;
    outline: none;
}

input:focus {
    border-color: #b34cff;
}

button {
    width: 100%;
    padding: 15px 10px;
    border: none;
    border-radius: 11px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.login {
    margin-bottom: 12px;
    background: #eee7ff;
    color: #24123c;
}

.facebook {
    background: #6425c5;
    color: white;
}

.convert {
    margin-top: 18px;
    color: white;
    background: linear-gradient(90deg, #7926ca, #b837ff);
}

.copy {
    margin-top: 12px;
    color: white;
    background: #35164f;
}

.result {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border: 1px solid #39264d;
    border-radius: 11px;
    background: #090711;
    overflow-wrap: anywhere;
}

.result-title {
    margin-bottom: 10px;
    color: #c084fc;
    font-size: 13px;
    font-weight: bold;
}

#resultText {
    font-size: 12px;
    line-height: 1.7;
    word-break: break-all;
}

#status {
    margin-top: 15px;
    min-height: 18px;
    color: #c084fc;
    font-size: 12px;
    text-align: center;
    line-height: 1.6;
}

.footer {
    margin-top: 25px;
    color: #756880;
    font-size: 10px;
    text-align: center;
    line-height: 1.8;
}
</style>
</head>

<body>
<main class="card">

    <h1>ACCESS GENERATOR</h1>
    <p class="subtitle">SECURE ACCESS INTERFACE</p>

    <button class="login" onclick="openProvider('google')">
        Continue with Google
    </button>

    <button class="facebook" onclick="openProvider('facebook')">
        Continue with Facebook
    </button>

    <label for="accessLink">Paste Your Link</label>

    <input
        id="accessLink"
        type="url"
        placeholder="https://example.com/?eat=..."
        autocomplete="off"
    >

    <button class="convert" id="convertBtn" onclick="processLink()">
        ACCESS TOKEN
    </button>

    <section class="result" id="result">
        <div class="result-title">LINK INFORMATION</div>
        <div id="resultText"></div>

        <button class="copy" onclick="copyResult()">
            COPY RESULT
        </button>
    </section>

    <div id="status" role="status"></div>

    <div class="footer">
        LINK VALIDATION MODE<br>
        REAL TOKEN CONVERSION REQUIRES AN AUTHORIZED API
    </div>

</main>

<script>
"use strict";

let currentResult = "";

function openProvider(provider) {
    const providers = {
        google: "https://accounts.google.com/",
        facebook: "https://m.facebook.com/privacy/consent/gdp/?params%5Bapp_id%5D=2036793259884297&params%5Blogger_id%5D=%228efac02a-9cdc-458a-893e-22c48021351b%22&params%5Bnext%5D=%22confirm%22&params%5Bredirect_uri%5D=%22https%3A%5C%2F%5C%2Fauth.garena.com%5C%2Funiversal%5C%2Foauth%5C%2Ffacebook%22&params%5Bresponse_type%5D=%22token%22&params%5Bscope%5D=%5B%22public_profile%22%2C%22email%22%2C%22user_friends%22%2C%22user_link%22%5D&params%5Bstate%5D=%2290940a3710fd4e8d9b943779a5a161e0-platform%3D3%26response_type%3Dcode%26locale%3Den-SG%26client_id%3D100067%26redirect_uri%3Dhttps%5Cu00253A%5Cu00252F%5Cu00252Fapi.ff.garena.co.id%5Cu00252Fauth%5Cu00252Fauth%5Cu00252Fcallback_n%5Cu00253Fsite%5Cu00253Dhttps%5Cu00253A%5Cu00252F%5Cu00252Fapi-discountstore.kiosgamer.gameid.garena.co.id%5Cu00252Foauth%5Cu00252Fcallback_redirect%5Cu00252F%22&params%5Bsteps%5D=%7B%7D&params%5Bcui_gk%5D=%22%5BPASS%5D%3Aconfirm%22&source=gdp_delegated&cache_buster=-3670712328463331327&_rdr"
    };

    window.open(
        providers[provider],
        "_blank",
        "noopener,noreferrer"
    );
}

function processLink() {
    const input = document.getElementById("accessLink").value.trim();
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const resultText = document.getElementById("resultText");
    const button = document.getElementById("convertBtn");

    result.style.display = "none";
    currentResult = "";

    if (!input) {
        status.textContent = "Please paste your link first.";
        return;
    }

    let url;

    try {
        url = new URL(input);
    } catch {
        status.textContent = "Invalid link. Please check your URL.";
        return;
    }

    if (url.protocol !== "https:") {
        status.textContent = "Please enter a valid HTTPS link.";
        return;
    }

    const eat = url.searchParams.get("eat");

    if (!eat) {
        status.textContent = "No EAT parameter was found in this link.";
        return;
    }

    button.disabled = true;
    button.textContent = "PROCESSING...";

    status.textContent = "Checking link information...";

    window.setTimeout(() => {
        currentResult =
            "EAT value found. Real access-token conversion has not been performed.";

        resultText.textContent = currentResult;
        result.style.display = "block";

        status.textContent =
            "Link checked. An authorized conversion API is required for a real token.";

        button.disabled = false;
        button.textContent = "ACCESS TOKEN";
    }, 500);
}

async function copyResult() {
    const status = document.getElementById("status");

    if (!currentResult) {
        status.textContent = "No result available to copy.";
        return;
    }

    try {
        await navigator.clipboard.writeText(currentResult);
        status.textContent = "Result copied.";
    } catch {
        status.textContent =
            "Automatic copy unavailable. Please select the result manually.";
    }
}
</script>
</body>
</html>
