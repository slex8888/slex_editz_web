<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080610">
<title>ACCESS GENERATOR</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #080610;
  color: #f5f0ff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  background: #100c1c;
  border: 1px solid #5422a5;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 0 30px #6d28d933;
}

.logo {
  text-align: center;
  color: #bb86fc;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 2px;
}

.subtitle {
  text-align: center;
  color: #9c91ad;
  font-size: 12px;
  margin: 8px 0 25px;
}

label {
  display: block;
  color: #c9b3f5;
  font-size: 13px;
  margin: 17px 0 8px;
}

button, input {
  width: 100%;
  border-radius: 9px;
  padding: 13px;
  font-size: 14px;
}

input {
  background: #090711;
  color: white;
  border: 1px solid #382653;
  outline: none;
}

input:focus {
  border-color: #a855f7;
  box-shadow: 0 0 10px #9333ea33;
}

button {
  border: none;
  cursor: pointer;
  font-weight: bold;
  margin-top: 10px;
  transition: .2s;
}

button:hover {
  transform: translateY(-1px);
  filter: brightness(1.15);
}

.google {
  background: #eee8ff;
  color: #25123e;
}

.facebook {
  background: #6425c5;
  color: white;
}

.generate {
  background: linear-gradient(90deg, #7928ca, #b044ff);
  color: white;
  margin-top: 18px;
}

.output {
  margin-top: 18px;
  padding: 13px;
  border-radius: 9px;
  background: #090711;
  border: 1px solid #382653;
  overflow-wrap: anywhere;
  font-size: 12px;
  color: #d8baff;
  display: none;
}

.status {
  min-height: 18px;
  color: #c084fc;
  font-size: 12px;
  margin-top: 13px;
  text-align: center;
}

.footer {
  text-align: center;
  color: #6f647f;
  font-size: 10px;
  margin-top: 22px;
}
</style>
</head>

<body>
<main class="container">
  <div class="logo">ACCESS GENERATOR</div>
  <div class="subtitle">SECURE DEMO INTERFACE</div>

  <button class="google" onclick="openLogin('google')">
    Continue with Google
  </button>

  <button class="facebook" onclick="openLogin('facebook')">
    Continue with Facebook
  </button>

  <label for="accessLink">Access Link / Demo Input</label>
  <input
    id="accessLink"
    type="text"
    placeholder="Paste a test link or text..."
    autocomplete="off"
  >

  <button class="generate" onclick="convertDemo()">
    CONVERT DEMO TOKEN
  </button>

  <div class="output" id="output"></div>
  <div class="status" id="status" role="status"></div>

  <div class="footer">
    DEMO MODE · NO REAL ACCOUNT TOKENS ARE CREATED
  </div>
</main>

<script>
function openLogin(provider) {
  const status = document.getElementById("status");

  if (provider === "google") {
    window.open(
      "https://acesse.one/5s4d9dc",
      "_blank",
      "noopener,noreferrer"
    );
    status.textContent =
      "Google opened. This demo does not capture login credentials or tokens.";
  } else {
    window.open(
      "https://www.facebook.com/login/",
      "_blank",
      "noopener,noreferrer"
    );
    status.textContent =
      "Facebook opened. This demo does not capture login credentials or tokens.";
  }
}

function convertDemo() {
  const input = document.getElementById("accessLink").value.trim();
  const output = document.getElementById("output");
  const status = document.getElementById("status");

  if (!input) {
    status.style.color = "#facc15";
    status.textContent = "Please enter some test text first.";
    output.style.display = "none";
    return;
  }

  // Local demonstration only; this is NOT a real access token.
  const demoToken =
    "DEMO_" + btoa(unescape(encodeURIComponent(input))).slice(0, 24);

  output.textContent = "Demo token: " + demoToken;
  output.style.display = "block";

  status.style.color = "#c084fc";
  status.textContent =
    "Demo complete. No request was sent and no real token was generated.";
}
</script>
</body>
</html>
